server:
  # Managed container platforms inject PORT. SERVER_PORT remains available for local use.
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    # /api/v1/analyze/raster carries base64-encoded uploaded imagery in the JSON body;
    # Tomcat's 2MB defaults are far too small for that.
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

spring:
  application:
    name: satquery-backend
  main:
    banner-mode: console

services:
  connect-timeout-ms: ${DOWNSTREAM_CONNECT_TIMEOUT_MS:10000}
  # Render free-tier Python services may cold-start and take 20-30s to respond.
  read-timeout-ms: ${DOWNSTREAM_READ_TIMEOUT_MS:30000}
  nlp:
    url: ${NLP_SERVICE_URL:http://localhost:8001}
  data:
    url: ${DATA_SERVICE_URL:http://localhost:8002}
  eo:
    url: ${EO_SERVICE_URL:http://localhost:8003}

app:
  cors:
    # Comma-separated browser origin PATTERNS (wildcards allowed, e.g. https://*.vercel.app
    # to also cover per-branch/per-PR preview deployments). Configure the deployed frontend
    # origin(s) in production via CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
