version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: satquery-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_SPRING_BOOT_API_URL=http://localhost:8080
    depends_on:
      - spring-boot-backend

  spring-boot-backend:
    build:
      context: ./backend/spring-boot
      dockerfile: ../../docker/Dockerfile.spring-boot
    container_name: satquery-spring-boot
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - NLP_SERVICE_URL=http://nlp-service:8001
      - DATA_SERVICE_URL=http://data-service:8002
      - EO_SERVICE_URL=http://eo-analysis-service:8003
    depends_on:
      - nlp-service
      - data-service
      - eo-analysis-service

  nlp-service:
    build:
      context: ./services/nlp-service
      dockerfile: ../../docker/Dockerfile.nlp
    container_name: satquery-nlp-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LLM_PROVIDER=rule_based
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  data-service:
    build:
      context: ./services/data-service
      dockerfile: ../../docker/Dockerfile.data-service
    container_name: satquery-data-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://satquery:earthpass@postgres:5432/satquery_db
    depends_on:
      - postgres

  eo-analysis-service:
    build:
      context: ./services/eo-analysis-service
      dockerfile: ../../docker/Dockerfile.eo-analysis
    container_name: satquery-eo-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003

  postgres:
    image: postgis/postgis:16-3.4
    container_name: satquery-postgis
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=satquery
      - POSTGRES_PASSWORD=earthpass
      - POSTGRES_DB=satquery_db
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d

volumes:
  postgis_data:
