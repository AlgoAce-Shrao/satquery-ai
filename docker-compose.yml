version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # Use Nginx's same-origin /api proxy in the self-hosted stack.
        VITE_SPRING_BOOT_API_URL: ""
    container_name: satquery-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      spring-boot-backend:
        condition: service_healthy

  spring-boot-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.spring-boot
    container_name: satquery-spring-boot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DOWNSTREAM_REQUEST_TIMEOUT_MS=10000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - NLP_SERVICE_URL=http://nlp-service:8001
      - DATA_SERVICE_URL=http://data-service:8002
      - EO_SERVICE_URL=http://eo-analysis-service:8003
    depends_on:
      nlp-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
      eo-analysis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nlp-service:
    build:
      context: ./services/nlp-service
      dockerfile: ../../docker/Dockerfile.nlp
    container_name: satquery-nlp-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LLM_PROVIDER=rule_based
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  data-service:
    build:
      context: ./services/data-service
      dockerfile: ../../docker/Dockerfile.data-service
    container_name: satquery-data-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-satquery}:${POSTGRES_PASSWORD:-change-this-before-production}@postgres:5432/${POSTGRES_DB:-satquery_db}
      - DATA_SERVICE_ALLOW_SEED_FALLBACK=false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  eo-analysis-service:
    build:
      context: ./services/eo-analysis-service
      dockerfile: ../../docker/Dockerfile.eo-analysis
    container_name: satquery-eo-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgis/postgis:16-3.4
    container_name: satquery-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-satquery}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-this-before-production}
      - POSTGRES_DB=${POSTGRES_DB:-satquery_db}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgis_data:
